# Render Blueprint for Heirloom: free demo deployment (canned AI responses).
# For real Gemma + Whisper on Render, see "Deploy on Render" in README.md.
services:
  - type: web
    name: heirloom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HEIRLOOM_DEMO
        value: "1"
